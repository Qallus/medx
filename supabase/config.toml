# Supabase CLI config for Medical X Scottsdale
# Set project_id to the project ref after running `supabase link`.

project_id = "medx"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# The site has no user accounts; the marketing forms post to an Edge Function.
[auth]
enabled = false

[storage]
enabled = false

# Public contact form - visitors are anonymous, so no JWT is required.
# Abuse is handled inside the function (honeypot + per-IP rate limit).
[functions.send-inquiry]
verify_jwt = false
