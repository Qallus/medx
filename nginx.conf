# Only the production hostnames are indexable. Every other host that reaches
# this container - the review domain app.medxscottsdale.com, the raw IP, any
# Coolify-generated preview URL - is served a disallow-all robots.txt and an
# X-Robots-Tag: noindex header, so the review copy cannot outrank or duplicate
# the real site in search. Move a host into the "1" branch to make it indexable.
map $host $is_prod_host {
    default                 0;
    medxscottsdale.com      1;
    www.medxscottsdale.com  1;
}

map $is_prod_host $robots_tag {
    0  "noindex, nofollow";
    1  "";          # empty value -> nginx omits the header entirely
}

map $is_prod_host $robots_file {
    0  /robots.staging.txt;
    1  /robots.prod.txt;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index Home.html;

    # Page filenames contain spaces (e.g. "Alcohol Detox.html"); browsers send
    # them percent-encoded and nginx decodes them before matching the filesystem.
    charset utf-8;
    autoindex off;

    # NOTE: caching below is expressed with `expires`, never `add_header
    # Cache-Control`. A location-level add_header discards every add_header
    # inherited from this server block, which would strip the security and
    # X-Robots-Tag headers from the responses that most need them.
    add_header X-Robots-Tag            $robots_tag      always;
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        try_files $robots_file =404;
    }

    # Coolify / uptime health probe
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # People who type /index.html land on the real home page
    location = /index.html {
        return 302 /Home.html;
    }

    location / {
        # Allow extensionless links ("/About") to resolve to "About.html"
        try_files $uri $uri.html $uri/ =404;
    }

    # Asset filenames are not content-hashed, so revalidate rather than
    # caching hard - a redeployed logo must not stay stale for a year.
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 1d;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
    }

    location ~* \.html$ {
        expires -1;     # emits Cache-Control: no-cache
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;
}
