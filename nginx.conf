server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index Home.html;

    # Page filenames contain spaces (e.g. "Alcohol Detox.html"); browsers send
    # them percent-encoded and nginx decodes them before matching the filesystem.
    charset utf-8;
    autoindex off;

    # Coolify / uptime health probe
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # People who type /index.html land on the real home page
    location = /index.html {
        return 302 /Home.html;
    }

    location / {
        # Allow extensionless links ("/About") to resolve to "About.html"
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    # Fingerprint-free assets: revalidate daily rather than caching forever
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;
}
