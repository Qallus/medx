# Pages used to be served as "/Alcohol Detox.html" - mixed case, spaces, and a
# .html extension. They are now lowercase hyphenated and extensionless. $uri is
# already percent-decoded here, so the old paths are matched with real spaces.
# Keep these permanently: they are the only thing carrying link equity and
# existing bookmarks across to the new URLs.
map $uri $legacy_url {
    default "";
    "/Home.html"                                /;
    "/About.html"                               /about;
    "/Services.html"                            /services;
    "/Contact.html"                             /contact;
    "/Our Team.html"                            /our-team;
    "/In The News.html"                         /in-the-news;
    "/Dashboard.html"                           /dashboard;
    "/Opioid Detox.html"                        /opioid-detox;
    "/Alcohol Detox.html"                       /alcohol-detox;
    "/Buprenorphine Treatment.html"             /buprenorphine-treatment;
    "/Naltrexone Treatment.html"                /naltrexone-treatment;
    "/IV Treatment.html"                        /iv-treatment;
    "/Polysubstance Detox.html"                 /polysubstance-detox;
    "/Vivitrol Alcohol Treatment.html"          /vivitrol-alcohol-treatment;
    "/Vivitrol Opioid Treatment.html"           /vivitrol-opioid-treatment;
    "/Alcoholism Treatment Resources.html"      /alcoholism-treatment-resources;
    "/At Home Detoxing Dangers.html"            /at-home-detoxing-dangers;
    "/Detoxing from Alcohol at Home.html"       /detoxing-from-alcohol-at-home;
    "/Fentanyl in Arizona.html"                 /fentanyl-in-arizona;
    "/Ozempic Dangers.html"                     /ozempic-dangers;
    "/Prescription Drug Abuse.html"             /prescription-drug-abuse;
    "/Your Brain On Drugs.html"                 /your-brain-on-drugs;
    "/Privacy Policy.html"                      /privacy-policy;
    "/Terms of Service.html"                    /terms-of-service;
}

# Only the production hostnames are indexable. Every other host that reaches
# this container - the review domain app.medxscottsdale.com, the raw IP, any
# Coolify-generated preview URL - is served a disallow-all robots.txt and an
# X-Robots-Tag: noindex header, so the review copy cannot outrank or duplicate
# the real site in search. Move a host into the "1" branch to make it indexable.
map $host $is_prod_host {
    default                 0;
    medxscottsdale.com      1;
    www.medxscottsdale.com  1;
}

map $is_prod_host $robots_tag {
    0  "noindex, nofollow";
    1  "";          # empty value -> nginx omits the header entirely
}

map $is_prod_host $robots_file {
    0  /robots.staging.txt;
    1  /robots.prod.txt;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index home.html;

    charset utf-8;
    autoindex off;

    # Emit relative Location headers. Traefik terminates TLS and proxies plain
    # HTTP to this container, so nginx would otherwise build redirects as
    # "http://host/path" - downgrading every legacy URL to http and forcing a
    # second hop back through Traefik's https redirect.
    absolute_redirect off;

    # NOTE: caching below is expressed with `expires`, never `add_header
    # Cache-Control`. A location-level add_header discards every add_header
    # inherited from this server block, which would strip the security and
    # X-Robots-Tag headers from the responses that most need them.
    add_header X-Robots-Tag            $robots_tag      always;
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        try_files $robots_file =404;
    }

    # Coolify / uptime health probe
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # www is canonical. The apex A record is currently locked at the
    # registrar and still resolves to the old host; the moment it can be
    # pointed here, this sends it to www instead of serving a duplicate.
    if ($host = medxscottsdale.com) {
        return 301 https://www.medxscottsdale.com$request_uri;
    }

    # Legacy .html URLs -> their clean equivalents. 301, not 302, so search
    # engines transfer ranking rather than keeping the old URL indexed.
    if ($legacy_url != "") {
        return 301 $legacy_url;
    }

    location = /index.html {
        return 301 /;
    }

    # WordPress served these with a trailing slash. Collapse to the canonical
    # no-slash form so both spellings do not get indexed separately. The regex
    # requires a character before the slash, so "/" itself never matches.
    location ~ ^(/.+)/$ {
        return 301 $1;
    }

    location / {
        # Clean URLs: "/alcohol-detox" resolves to "alcohol-detox.html"
        try_files $uri $uri.html $uri/ =404;
    }

    # Asset filenames are not content-hashed, so revalidate rather than
    # caching hard - a redeployed logo must not stay stale for a year.
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 1d;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
    }

    location ~* \.html$ {
        expires -1;     # emits Cache-Control: no-cache
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;
}
